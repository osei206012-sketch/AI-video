services:
  - type: web
    name: motionmint-ai-video
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HF_SPACE_ID
        value: OpenKing/wan2-video-generation
      - key: HF_SPACE_API_NAME
        value: /generate_video
      - key: MAX_ACTIVE_JOBS
        value: 1
